# Add-on services for RAG (Phase 8) — run alongside the existing native app:
#
#   docker compose -f docker-compose.addendum.yml up -d
#
# Covers ONLY the two net-new containers. The MCP server / HTTP gateway keep
# running natively on the domain-joined Windows host and are NOT containerized.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: sharepoint-ai-pgvector
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag
    ports:
      - '5432:5432'
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai -d rag']
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-server:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: sharepoint-ai-embeddings
    environment:
      MODEL_ID: BAAI/bge-large-en-v1.5
    ports:
      - '8080:80'
    volumes:
      - embedding_cache:/data

volumes:
  pgvector_data: {}
  embedding_cache: {}
