# Full local stack: HTTP gateway (the complete app) + pgvector + embedding server.
#
#   docker compose up --build
#
# Requires a `.env` file (copy `.env.example`) with at least:
#   SHAREPOINT_SITE_URL, SHAREPOINT_USERNAME, SHAREPOINT_PASSWORD, SHAREPOINT_DOMAIN
#
# The gateway authenticates to SharePoint over NTLM by default — Kerberos needs
# domain membership, which is impractical inside a container. If SharePoint runs
# on this host, set SHAREPOINT_SITE_URL to http://host.docker.internal/...
services:
  gateway:
    build: .
    container_name: sharepoint-ai-gateway
    restart: on-failure
    env_file:
      - path: .env
        required: false
    environment:
      # Container-specific overrides (the .env values point at localhost).
      SHAREPOINT_AUTH_MODE: ntlm
      HTTP_GATEWAY_PORT: 3001
      PGVECTOR_CONNECTION_STRING: postgres://ai:changeme@pgvector:5432/rag
      EMBEDDING_API_BASE_URL: http://embedding-server:80/v1
      # LLM chat (OpenAI-compatible) — set in .env; empty disables the chat UI.
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_STEPS: ${LLM_MAX_STEPS:-8}
      AUDIT_LOG_PATH: /app/data/audit.jsonl
    volumes:
      - assistant_data:/app/data
    extra_hosts:
      - '${SHAREPOINT_HOST_NAME:-bshare}:${SHAREPOINT_HOST_IP:-192.168.122.44}'
    ports:
      - '${HTTP_GATEWAY_PORT:-3001}:3001'
    depends_on:
      pgvector:
        condition: service_healthy
      embedding-server:
        condition: service_started

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: sharepoint-ai-pgvector
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag
    ports:
      - '5432:5432'
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai -d rag']
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-server:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: sharepoint-ai-embeddings
    environment:
      MODEL_ID: BAAI/bge-large-en-v1.5
    ports:
      - '8080:80'
    volumes:
      - embedding_cache:/data

volumes:
  assistant_data: {}
  pgvector_data: {}
  embedding_cache: {}
