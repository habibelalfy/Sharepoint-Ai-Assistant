<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SharePoint AI Assistant</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #f5f6f8;
      }
      header {
        background: #1f2937;
        color: #fff;
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        white-space: nowrap;
      }
      header input {
        flex: 1;
        padding: 7px 10px;
        border-radius: 6px;
        border: none;
        font-size: 13px;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 72%;
        padding: 10px 14px;
        border-radius: 12px;
        white-space: pre-wrap;
        line-height: 1.45;
        font-size: 14px;
      }
      .msg.user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
      }
      .msg.assistant {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #e5e7eb;
        color: #111827;
      }
      .msg.system {
        align-self: center;
        color: #6b7280;
        font-size: 12px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: #fff;
        border-top: 1px solid #e5e7eb;
      }
      form textarea {
        flex: 1;
        resize: none;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-family: inherit;
        font-size: 14px;
      }
      form button {
        padding: 0 22px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      form button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SharePoint AI Assistant</h1>
      <input
        id="token"
        type="password"
        placeholder="Bearer token — generate with `npm run mint-token`"
      />
    </header>
    <div id="messages"></div>
    <form id="chat">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask about projects, tasks, or documents…"
        required
      ></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <script>
      const messages = [];
      const messagesEl = document.getElementById('messages');
      const form = document.getElementById('chat');
      const input = document.getElementById('input');
      const send = document.getElementById('send');
      const tokenEl = document.getElementById('token');

      tokenEl.value = localStorage.getItem('token') || '';
      tokenEl.addEventListener('input', () => localStorage.setItem('token', tokenEl.value));

      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || send.disabled) return;
        input.value = '';
        addMessage('user', text);

        const history = [...messages, { role: 'user', content: text }];
        send.disabled = true;
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + tokenEl.value,
            },
            body: JSON.stringify({ messages: history }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || 'HTTP ' + res.status);
          }
          addMessage('assistant', data.reply);
          messages.push({ role: 'user', content: text });
          messages.push({ role: 'assistant', content: data.reply });
        } catch (err) {
          addMessage('system', 'Error: ' + err.message);
        } finally {
          send.disabled = false;
        }
      });
    </script>
  </body>
</html>
